name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: npm ci
      - run: pip install -r requirements.lock.txt
      - run: python -m backend.pipeline
      - run: python -m evals.run
      - run: python -m pytest
      - run: ruff check backend tests evals
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser journeys against built export
        run: |
          python -m http.server 3000 --directory out --bind 127.0.0.1 > /tmp/banktax-web.log 2>&1 &
          npm run test:e2e
      - name: Verify Docker and run both services
        run: |
          docker compose up --build -d
          for i in $(seq 1 30); do
            if curl --fail http://localhost:8080/ && curl --fail http://localhost:8000/api/health; then break; fi
            sleep 2
          done
          curl --fail http://localhost:8080/data/demo.json > /dev/null
          curl --fail http://localhost:8000/api/enterprises/P-001 > /dev/null
          docker compose down
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-and-browser-artifacts
          path: |
            evals/results/
            output/playwright/
            docs/screenshots/
            test-results/
